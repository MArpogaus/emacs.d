# Checks that run before a commit, and the heavier ones before a push:
#
#     pre-commit install --install-hooks -t pre-commit -t commit-msg -t pre-push
#
# The Lisp files are tangled from emacs.org, so no hook here rewrites
# them: the elisp hooks only check, and a finding is fixed in emacs.org.
exclude: ^(elpaca\.lock|img/)

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-executables-have-shebangs
  - id: check-merge-conflict
  - id: check-shebang-scripts-are-executable
  - id: check-yaml
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: trailing-whitespace
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.17.0
  hooks:
  - id: commitizen
  - id: commitizen-branch
    stages: [pre-push]
- repo: https://github.com/MArpogaus/emacs-pre-commit-hooks
  rev: v0.2.0
  hooks:
  - id: elisp-complexity
  - id: elisp-checkdoc
  - id: elisp-check-declare
